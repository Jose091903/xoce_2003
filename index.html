<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tú y Yo: El Sol y La Luna</title>
    <meta name="description" content="Una página de amor inspirada en el sol y la luna.">
    <link rel="stylesheet" href="style.css">
    <!-- Importamos fuentes clásicas con estilo Victoriano y romántico -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Efecto de nebulosa en movimiento de fondo -->
    <div id="nebula"></div>

    <!-- Contenedores para efecto Parallax Estelar por giroscopio -->
    <div id="stars-container">
        <div id="stars-far"></div>
        <div id="stars-mid"></div>
        <div id="stars-near"></div>
    </div>

    <div class="container">
        <!-- Textos que se revelan al hacer clic -->
        <h1 class="title">Nuestro Eclipse</h1>
        <p class="subtitle">Como el sol y la luna, destinados a encontrarse.</p>

        <!-- Zona interactiva central (se eliminó el texto flotante para un diseño más limpio) -->
        <div class="celestial-body-container" id="interaction-zone">
            <div class="sun"></div>
            <div class="moon"></div>
            <div class="glow"></div>
        </div>

        <!-- Mensaje romántico (Ella luna, él sol) -->
        <div class="message-container" id="message">
            <p>"Si tú eres la luna que ilumina mis noches más oscuras,"</p>
            <p>"yo seré el sol que siempre estará aquí para darte calor."</p>
            <p class="heart">❤</p>
        </div>
    </div>

    <!-- Etiqueta de audio -->
    <audio id="bg-music" loop>
        <source src="Radiohead - You.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <script src="script.js"></script>
</body>
</html>
